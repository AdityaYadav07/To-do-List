<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
     <title>To-do List</title>
<link rel="stylesheet" href="./styles.css">

    <!-- Bootstrap container -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <div class="container">
       <h1> <i class="fa-solid fa-list-check"></i> To-do list</h1>

      <form id="taskForm">
        <label for="taskInput"> <i class="fa-solid fa-pencil"></i> Enter Your Task</label>
        <input type="text" id="taskInput" class="form-control" placeholder="Enter Your Task..." autocomplete="off"> <br><br>
        <button  class="btn btn-primary" type="submit" style="text-align: center;"> <i class="fa-solid fa-plus"></i> Add Task</button>
      </form>

      <!-- To-do List --> 
       <div class="mt-4"> 
        <h3> <i class="fa-solid fa-user"></i> My Tasks</h3> 
        <ul id="taskList" class="list-group">
        </ul> 
    </div>

    </div>

    <script src="./script.js"></script>
</body>
</html>
